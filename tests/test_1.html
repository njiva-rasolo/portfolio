<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrousel CSS</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }

  .carousel {
    display: flex;
    /*overflow-x: auto;*/
    overflow: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    width: 80%;
    margin: 50px auto;
    border: 2px solid #ccc;
    border-radius: 10px;
  }

  .carousel-item {
    flex: none;
    width: 100%;
    height: 300px;
    scroll-snap-align: start;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    color: white;
  }

  .item1 { background-color: #3498db; }
  .item2 { background-color: #e74c3c; }
  .item3 { background-color: #2ecc71; }

  /* Boutons */
  .buttons {
    text-align: center;
    margin-top: 10px;
  }

  .buttons button {
    padding: 10px 20px;
    font-size: 16px;
    margin: 0 5px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="carousel" id="carousel">
  <div class="carousel-item item1">Page 1</div>
  <div class="carousel-item item2">Page 2</div>
  <div class="carousel-item item3">Page 3</div>
</div>

<div class="buttons">
  <button onclick="prev()">◀️</button>
  <button onclick="next()">▶️</button>
</div>

<script>
  const carousel = document.getElementById('carousel');

  function next() {
    carousel.scrollBy({ left: carousel.offsetWidth, behavior: 'smooth' });
  }

  function prev() {
    carousel.scrollBy({ left: -carousel.offsetWidth, behavior: 'smooth' });
  }
</script>

</body>
</html>
