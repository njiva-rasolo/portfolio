<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CV - Carrousel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style_2.css">
</head>
<body>

  <!-- Conteneur principal -->
  <main class="carousel-wrapper">

    <!-- Carrousel -->
    <section class="carousel-container">
      <div class="carousel-track" id="track">

        <article class="slide">
          <div class="a4">
            Page A4 - CV 1
          </div>
        </article>

        <article class="slide">
          <div class="a4">
            Page A4 - CV 2
          </div>
        </article>

        <article class="slide">
          <div class="a4">
            Page A4 - CV 3
          </div>
        </article>

      </div>
    </section>

    <!-- Navigation -->
    <nav class="carousel-nav">
      <button onclick="prevSlide()">← Précédent</button>
      <button onclick="nextSlide()">Suivant →</button>
    </nav>

  </main>

  <!-- JS -->
  <script src="script_2.js"></script>
</body>
</html>
